name: Build Windows

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        build-type: [Debug, Release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check project structure
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Directory contents:"
          Get-ChildItem -Path . | Format-Table Name, PSIsContainer
          if (Test-Path "src/CMakeLists.txt") {
            Write-Host "✓ src/CMakeLists.txt found"
          } else {
            Write-Host "✗ src/CMakeLists.txt NOT found"
            exit 1
          }
        shell: powershell
      
      - name: Install CMake
        run: choco install cmake --no-progress -y
      
      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: 'false'
      
      - name: Verify Qt Installation
        run: |
          $QtPath = "D:\a\CSNZ_ServerX\Qt\6.5.3\msvc2019_64"
          if (Test-Path $QtPath) {
            Write-Host "✓ Qt found at: $QtPath"
            echo "QTDIR=$QtPath" >> $env:GITHUB_ENV
          } else {
            Write-Host "✗ Qt path does not exist"
            exit 1
          }
        shell: powershell
      
      - name: Configure CMake
        run: |
          cmake -B build -S src `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}" `
            -G "Visual Studio 16 2019" `
            -A x64
        shell: powershell
      
      - name: Build Project
        run: |
          cmake --build build --config ${{ matrix.build-type }} --parallel $env:NUMBER_OF_PROCESSORS
        shell: powershell
      
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.build-type }}
          path: build/
          retention-days: 7

name: Build Windows

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        build-type: [Debug, Release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install CMake
        run: |
          choco install cmake --no-progress
          
      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: 'true'
      
      - name: Set Qt Environment Variable
        run: |
          $QtPath = "C:\Qt\6.5.3\msvc2019_64"
          echo "QTDIR=$QtPath" >> $env:GITHUB_ENV
          echo "Qt5_DIR=$QtPath\lib\cmake\Qt5" >> $env:GITHUB_ENV
        shell: powershell
      
      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}" `
            -G "Visual Studio 16 2019" `
            -A x64
        shell: powershell
      
      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build-type }} --parallel $env:NUMBER_OF_PROCESSORS
        shell: powershell
      
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.build-type }}
          path: build/
          retention-days: 7
